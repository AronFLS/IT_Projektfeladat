<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cím</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <script src="js/app.js" defer></script>
    <link rel="stylesheet" href="css/stilus.css" />
  </head>
  <body class="kalkulator">
    <header>
      <h1>Title</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="gyakorlatok.html">Gyakorlatok</a></li>
          <li><a href="edzestervek.html">Edzéstervek</a></li>
          <li class="active_li">Kalkulátor</li>
          <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
      </nav>
    </header>
    <h2>Egyismétléses maxium kalkulátor</h2>
    <article>
      <form class="kalkulator-form" onsubmit="oneRepMax(event)">
        <div class="form-group">
          <label for="suly">Súly (kg):</label>
          <input type="number" id="suly" name="suly" value="0" min="0" />
        </div>

        <div class="form-group">
          <label for="ismetles">Ismétlésszám:</label>
          <input
            type="number"
            id="ismetles"
            name="ismetles"
            value="0"
            min="0"
          />
        </div>

        <button onclick="oneRepMax()">Számol</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Százalék</th>
            <th>Suly</th>
            <th>Ismetles</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-percent="100">100%</td>
            <td class="sulyEredmeny">-</td>
            <td>1</td>
          </tr>
          <tr>
            <td data-percent="95">95%</td>
            <td class="sulyEredmeny">-</td>
            <td>2</td>
          </tr>
          <tr>
            <td data-percent="90">90%</td>
            <td class="sulyEredmeny">-</td>
            <td>4</td>
          </tr>
          <tr>
            <td data-percent="85">85%</td>
            <td class="sulyEredmeny">-</td>
            <td>6</td>
          </tr>
          <tr>
            <td data-percent="80">80%</td>
            <td class="sulyEredmeny">-</td>
            <td>8</td>
          </tr>
          <tr>
            <td data-percent="75">75%</td>
            <td class="sulyEredmeny">-</td>
            <td>10</td>
          </tr>
          <tr>
            <td data-percent="70">70%</td>
            <td class="sulyEredmeny">-</td>
            <td>12</td>
          </tr>
          <tr>
            <td data-percent="65">65%</td>
            <td class="sulyEredmeny">-</td>
            <td>16</td>
          </tr>
          <tr>
            <td data-percent="60">60%</td>
            <td class="sulyEredmeny">-</td>
            <td>20</td>
          </tr>
          <tr>
            <td data-percent="55">55%</td>
            <td class="sulyEredmeny">-</td>
            <td>24</td>
          </tr>
          <tr>
            <td data-percent="50">50%</td>
            <td class="sulyEredmeny">-</td>
            <td>30</td>
          </tr>
        </tbody>
      </table>
    </article>
  </body>
</html>
