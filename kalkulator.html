<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cím</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/stilus.css" />
    <script src="js/app.js"></script>
  </head>
  <body class="kalkulator">
    <header>
      <h1>Title</h1>
      <nav>
        <ul>
          <li class="nav">
            <a href="index.html" aria-label="Kezdőlap">
              <span class="nav_desktop">Home</span>
              <span class="nav_mobile">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
              </span>
            </a>
          </li>
          <li class="nav">
            <a href="gyakorlatok.html"
              ><span class="nav_desktop">Gyakorlatok</span
              ><span class="nav_mobile"
                ><i class="fa-solid fa-dumbbell" aria-hidden="true"></i></span
            ></a>
          </li>
          <li class="nav">
            <a href="edzestervek.html"
              ><span class="nav_desktop">Edzéstervek</span
              ><span class="nav_mobile"
                ><i class="fa-solid fa-list-check" aria-hidden="true"></i></span
            ></a>
          </li>
          <li class="active_li">
            <a href="kalkulator.html"
              ><span class="nav_desktop">Kalkulátor</span
              ><span class="nav_mobile"
                ><i class="fa-solid fa-calculator" aria-hidden="true"></i></span
            ></a>
          </li>
          <li class="nav">
            <a href="kapcsolat.html"
              ><span class="nav_desktop">Kapcsolat</span
              ><span class="nav_mobile"
                ><i class="fa-solid fa-envelope" aria-hidden="true"></i></span
            ></a>
          </li>
        </ul>
      </nav>
    </header>
    <h2>Egyismétléses maxium kalkulátor</h2>
    <article>
      <form class="kalkulator-form" onsubmit="oneRepMax(event)">
        <div class="form-group">
          <label for="suly">Súly (kg):</label>
          <input type="number" id="suly" name="suly" value="0" min="0" />
        </div>

        <div class="form-group">
          <label for="ismetles">Ismétlésszám:</label>
          <input
            type="number"
            id="ismetles"
            name="ismetles"
            value="0"
            min="0"
          />
        </div>

        <button onclick="oneRepMax()">Számol</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Százalék</th>
            <th>Suly</th>
            <th>Ismetles</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-percent="100">100%</td>
            <td class="sulyEredmeny">-</td>
            <td>1</td>
          </tr>
          <tr>
            <td data-percent="95">95%</td>
            <td class="sulyEredmeny">-</td>
            <td>2</td>
          </tr>
          <tr>
            <td data-percent="90">90%</td>
            <td class="sulyEredmeny">-</td>
            <td>4</td>
          </tr>
          <tr>
            <td data-percent="85">85%</td>
            <td class="sulyEredmeny">-</td>
            <td>6</td>
          </tr>
          <tr>
            <td data-percent="80">80%</td>
            <td class="sulyEredmeny">-</td>
            <td>8</td>
          </tr>
          <tr>
            <td data-percent="75">75%</td>
            <td class="sulyEredmeny">-</td>
            <td>10</td>
          </tr>
          <tr>
            <td data-percent="70">70%</td>
            <td class="sulyEredmeny">-</td>
            <td>12</td>
          </tr>
          <tr>
            <td data-percent="65">65%</td>
            <td class="sulyEredmeny">-</td>
            <td>16</td>
          </tr>
          <tr>
            <td data-percent="60">60%</td>
            <td class="sulyEredmeny">-</td>
            <td>20</td>
          </tr>
          <tr>
            <td data-percent="55">55%</td>
            <td class="sulyEredmeny">-</td>
            <td>24</td>
          </tr>
          <tr>
            <td data-percent="50">50%</td>
            <td class="sulyEredmeny">-</td>
            <td>30</td>
          </tr>
        </tbody>
      </table>
    </article>
  </body>
</html>
